<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимная Стена</title>
    <script>

    const SUPABASE_KEY = 'sb_publishable_AcN89vQAY3mzDf9eVxDFcg_7Q3sXkbT';   // И это
    </script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .form { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 5px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #3d5afe; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .post { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #3d5afe; }
        .post img { max-width: 100%; margin-top: 10px; border-radius: 5px; }
        .time { font-size: 0.7rem; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <h1>👤 Анонимная Стена</h1>
    <div class="form">
        <textarea id="msg" placeholder="Твое анонимное сообщение..."></textarea>
        <button onclick="sendPost()">Отправить в вечность</button>
    </div>
    <div id="feed">Загрузка постов...</div>
</div>

<script>
    // ВСТАВЬ СВОИ ДАННЫЕ ТУТ:
    const SUPABASE_URL = 'ТВОЙ_PROJECT_URL';
    const SUPABASE_KEY = 'ТВОЙ_ANON_KEY';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Загрузка постов из базы
    async function loadPosts() {
        const { data, error } = await supabase
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) return console.error(error);
        
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        data.forEach(post => {
            const div = document.createElement('div');
            div.className = 'post';
            div.innerHTML = `<div class="time">${new Date(post.created_at).toLocaleString()}</div><div>${post.text}</div>`;
            feed.appendChild(div);
        });
    }

    // Отправка поста
    async function sendPost() {
        const text = document.getElementById('msg').value;
        if (!text) return;

        const { error } = await supabase
            .from('posts')
            .insert([{ text: text }]);

        if (error) alert("Ошибка!");
        else {
            document.getElementById('msg').value = '';
            loadPosts();
        }
    }

    loadPosts();
</script>
</body>
</html>
