<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аноним Чат</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .post { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #3d5afe; }
        textarea { width: 100%; height: 80px; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        button { background: #3d5afe; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        
        /* Стили для комментов */
        .comment-box { background: #252525; padding: 8px; margin-top: 5px; border-radius: 5px; font-size: 0.85rem; color: #bbb; border-left: 2px solid #555; }
        .reply-area { display: flex; gap: 5px; margin-top: 10px; }
        .reply-area input { flex: 1; background: #333; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; }
        .reply-area button { width: auto; margin: 0; padding: 5px 15px; background: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">Аноним Чат</h1>
    
    <!-- Форма создания поста -->
    <div style="background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <textarea id="postInput" placeholder="Напиши что-нибудь..."></textarea>
        <button onclick="sendPost()">Опубликовать пост</button>
    </div>

    <div id="feed">Загрузка...</div>
</div>

<script>
    const DB_URL = 'https://twwlnqvwjkqcxegeoote.supabase.co'; 
    const DB_KEY = 'sb_publishable_AcN89vQAY3mzDf9eVxDFcg_7Q3sXkbT';
    const client = supabase.createClient(DB_URL, DB_KEY);

    async function loadAll() {
        // Загружаем посты
        const { data: posts, error: pErr } = await client.from('posts').select('*').order('created_at', { ascending: false });
        // Загружаем комменты (если таблицы нет, будет ошибка, но код не умрет)
        const { data: comments, error: cErr } = await client.from('comments').select('*');

        if (pErr) { document.getElementById('feed').innerHTML = "Ошибка базы!"; return; }

        const feed = document.getElementById('feed');
        feed.innerHTML = '';

        posts.forEach(post => {
            const postComments = comments ? comments.filter(c => c.post_id == post.id) : [];
            
            const div = document.createElement('div');
            div.className = 'post';
            div.innerHTML = `
                <div style="font-size: 0.8rem; color: #666;">${new Date(post.created_at).toLocaleString()}</div>
                <div style="margin: 10px 0;">${post.text}</div>
                
                <!-- Список комментов -->
                <div id="list-${post.id}">
                    ${postComments.map(c => `<div class="comment-box">${c.text}</div>`).join('')}
                </div>

                <!-- ФОРМА ОТВЕТА (КНОПКА ТУТ) -->
                <div class="reply-area">
                    <input type="text" id="input-${post.id}" placeholder="Ответить...">
                    <button onclick="sendComment(${post.id})">ОК</button>
                </div>
            `;
            feed.appendChild(div);
        });
    }

    async function sendPost() {
        const text = document.getElementById('postInput').value.trim();
        if (!text) return;
        await client.from('posts').insert([{ text }]);
        document.getElementById('postInput').value = '';
        loadAll();
    }

    async function sendComment(postId) {
        const input = document.getElementById('input-' + postId);
        const text = input.value.trim();
        if (!text) return;

        const { error } = await client.from('comments').insert([{ post_id: postId, text: text }]);
        
        if (error) {
            alert("Ошибка! Ты создал таблицу 'comments' в Supabase? Код ошибки: " + error.message);
        } else {
            input.value = '';
            loadAll();
        }
    }

    loadAll();
    setInterval(loadAll, 10000); // Обновлять каждые 10 сек
</script>

</body>
</html>
