<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат 56 школы</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #3d5afe; }
        
        .post-form { background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 30px; }
        textarea { width: 100%; height: 100px; background: #2b2b2b; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; resize: none; box-sizing: border-box; font-size: 16px; }
        button { background: #3d5afe; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; }
        button:hover { background: #2a3eb1; }
        
        .feed { display: flex; flex-direction: column; gap: 15px; }
        .post { background: #1e1e1e; padding: 15px; border-radius: 12px; border-left: 5px solid #3d5afe; position: relative; }
        .post-time { font-size: 0.75rem; color: #777; margin-bottom: 8px; }
        .post-text { line-height: 1.5; word-wrap: break-word; }
        
        #status { font-size: 0.9rem; text-align: center; margin-bottom: 10px; color: #3d5afe; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏫 Чат 56 школы</h1>
        <p>Анонимные сообщения</p>
    </div>

    <div class="post-form">
        <textarea id="postInput" placeholder="Что ты хочешь сказать анонимно?"></textarea>
        <button id="submitBtn">Отправить сообщение</button>
    </div>

    <div id="status">Загрузка сообщений...</div>
    <div class="feed" id="postFeed"></div>
</div>

<script>
    // --- НАСТРОЙКИ (ВСТАВЬ СВОИ ДАННЫЕ ТУТ) ---
    const DB_URL = 'https://twwlnqvwjkqcxegeoote.supabase.co

'; 
    const DB_KEY = 'sb_publishable_AcN89vQAY3mzDf9eVxDFcg_7Q3sXkbT';

    // Инициализация клиента Supabase под уникальным именем
    const client = supabase.createClient(DB_URL, DB_KEY);

    const feedElement = document.getElementById('postFeed');
    const statusElement = document.getElementById('status');
    const inputElement = document.getElementById('postInput');
    const buttonElement = document.getElementById('submitBtn');

    // Функция для получения всех постов
    async function fetchPosts() {
        const { data, error } = await client
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            statusElement.innerText = "Ошибка загрузки: " + error.message;
            console.error(error);
        } else {
            statusElement.innerText = "";
            renderPosts(data);
        }
    }

    // Функция для отрисовки постов на странице
    function renderPosts(posts) {
        feedElement.innerHTML = '';
        posts.forEach(post => {
            const date = new Date(post.created_at).toLocaleString();
            const postDiv = document.createElement('div');
            postDiv.className = 'post';
            postDiv.innerHTML = `
                <div class="post-time">${date} • Аноним</div>
                <div class="post-text">${escapeHtml(post.text)}</div>
            `;
            feedElement.appendChild(postDiv);
        });
    }

    // Функция для отправки нового поста
    async function sendPost() {
        const content = inputElement.value.trim();
        if (!content) return;

        buttonElement.disabled = true;
        buttonElement.innerText = "Отправка...";

        const { error } = await client
            .from('posts')
            .insert([{ text: content }]);

        if (error) {
            alert("Ошибка отправки: " + error.message);
        } else {
            inputElement.value = "";
            await fetchPosts();
        }

        buttonElement.disabled = false;
        buttonElement.innerText = "Отправить сообщение";
    }

    // Защита от вредоносного кода (XSS)
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Вешаем событие на кнопку
    buttonElement.addEventListener('click', sendPost);

    // Загружаем посты при открытии сайта
    fetchPosts();
</script>

</body>
</html>
