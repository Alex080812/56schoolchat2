<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат 56 школы</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; }
        .form-box { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        textarea { width: 100%; height: 70px; background: #2b2b2b; color: white; border: 1px solid #444; border-radius: 8px; padding: 10px; resize: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #3d5afe; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2a3eb1; }
        .post { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #3d5afe; animation: fadeIn 0.5s ease; }
        .time { font-size: 0.7rem; color: #777; margin-bottom: 5px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🏫 Чат 56 школы</h1>
    <div class="form-box">
        <textarea id="msg" placeholder="Напиши анонимно..."></textarea>
        <button id="sendBtn">Отправить</button>
    </div>
    <div id="feed">Загрузка сообщений...</div>
</div>

<script>
    // --- НАСТРОЙКИ SUPABASE ---
    // Замени данные в кавычках на свои из раздела Project Settings -> API
    const DB_URL = 'https://twwlnqvwjkqcxegeoote.supabase.co

'; 
    const DB_KEY = '
sb_publishable_AcN89vQAY3mzDf9eVxDFcg_7Q3sXkbT
';

    // Создаем клиента под именем 'myApp' (чтобы не путать с библиотекой 'supabase')
    const myApp = supabase.createClient(DB_URL, DB_KEY);

    // Функция загрузки
    async function getPosts() {
        const { data, error } = await myApp
            .from('posts')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("Ошибка базы:", error.message);
            document.getElementById('feed').innerText = "Ошибка доступа к базе данных.";
            return;
        }
        
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'post';
            const date = new Date(item.created_at).toLocaleString();
            div.innerHTML = `<div class="time">${date}</div><div>${item.text}</div>`;
            feed.appendChild(div);
        });
    }

    // Функция отправки
    async function sendPost() {
        const input = document.getElementById('msg');
        const text = input.value.trim();
        
        if (!text) return;

        const { error } = await myApp
            .from('posts')
            .insert([{ text: text }]);

        if (error) {
            alert("Не удалось отправить: " + error.message);
        } else {
            input.value = '';
            getPosts(); // Обновляем ленту
        }
    }

    // Слушатель клика на кнопку (вместо onclick в HTML)
    document.getElementById('sendBtn').addEventListener('click', sendPost);

    // Загружаем посты сразу при открытии
    getPosts();
</script>

</body>
</html>
